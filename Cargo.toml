[workspace]
resolver = "2"
members = [
    "crates/core",   # std-only foundation: model, completion, history sync, scrubbing, key encoding
    "crates/vault",  # encrypted vault (XChaCha20-Poly1305 + Argon2id)
    "crates/ssh",    # SSH sessions (russh) + hardware signer auth
    "crates/ffi",    # flutter_rust_bridge API consumed by the apps
    "crates/cli",    # the Linux command line (`myterm`)
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
