[package]
name = "myterm-ssh"
description = "MyTerm SSH transport: russh sessions, host key checks, password/key/hardware-key auth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
myterm-core = { path = "../core" }
# 0.65.2: fixes the russh advisories up to 2026-11 (GHSA-47hw-gvq5-r2gm and others)
russh = "0.65.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
async-trait = "0.1"
thiserror = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
