[package]
name = "myterm-vault"
description = "MyTerm encrypted vault: Argon2id master password, XChaCha20-Poly1305 per-record encryption"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
myterm-core = { path = "../core" }
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
