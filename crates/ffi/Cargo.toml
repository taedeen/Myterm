[package]
name = "myterm-ffi"
description = "MyTerm API exposed to the Flutter apps via flutter_rust_bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
myterm-core = { path = "../core" }
myterm-vault = { path = "../vault" }
myterm-ssh = { path = "../ssh" }
flutter_rust_bridge = "=2.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
anyhow = "1"
async-trait = "0.1"

[lints.rust]
# flutter_rust_bridge codegen expands the crate with --cfg frb_expand.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
