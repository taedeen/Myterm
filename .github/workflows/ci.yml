name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p myterm-core
      - run: cargo clippy -p myterm-core --all-targets -- -D warnings

  crates:
    name: Vault + SSH (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p myterm-vault -p myterm-ssh
      - run: cargo clippy -p myterm-vault -p myterm-ssh --all-targets -- -D warnings

  sync-server:
    name: Sync server (tests + image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit and HTTP tests
        working-directory: server
        run: python -m unittest discover -s tests -v
      - name: Build image and smoke-test it
        working-directory: server
        run: |
          docker build -t myterm-sync:ci .
          mkdir -p "$RUNNER_TEMP/syncdata" && sudo chown 10001:10001 "$RUNNER_TEMP/syncdata"
          docker run -d --name sync -p 7341:7341 -e MYTERM_SYNC_TOKEN=ci-token-0123456789abcdef0123 \
            -e MYTERM_SYNC_CERT_PRINCIPALS=ci --tmpfs /tmp --read-only --user 10001 \
            -v "$RUNNER_TEMP/syncdata:/data" myterm-sync:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:7341/v1/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:7341/v1/health | grep -q '"ok": true'
          # Certificates on: the CA was created and is served.
          curl -fsS http://127.0.0.1:7341/v1/ssh-ca.pub | grep -q '^ssh-ed25519 .* myterm-user-ca'
          docker logs sync
          docker rm -f sync

  linux:
    # The `myterm` command line, for dbb, a Raspberry Pi or a Linux laptop.
    # Built on Ubuntu 22.04 (glibc 2.35), so it runs on Debian 12, Ubuntu
    # 22.04+ and Raspberry Pi OS (bookworm) and later.
    name: Linux command line (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
          - arch: aarch64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.arch }}
      - name: Tests
        run: |
          cargo test -p myterm-cli
          cargo test -p myterm-ffi --no-default-features
      - name: Clippy
        if: matrix.arch == 'x86_64'
        run: cargo clippy -p myterm-cli --all-targets -- -D warnings
      - name: Build
        run: cargo build --release -p myterm-cli
      - name: Smoke test
        run: |
          b=target/release/myterm
          $b --version
          $b --help > /dev/null
          export MYTERM_HOME="$RUNNER_TEMP/myterm-home"
          $b status | tee status.txt
          grep -q "not joined" status.txt
          [ "$(stat -c %a "$MYTERM_HOME")" = 700 ]
          [ "$(stat -c %a "$MYTERM_HOME/meta.json")" = 600 ]
          if $b hosts 2>err.txt; then echo "hosts should refuse before joining"; exit 1; fi
          grep -q "myterm join" err.txt
      - name: End-to-end (sync server, two devices, sshd trusting MyTerm certificates)
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y -qq openssh-server tmux > /dev/null
          sudo systemctl start ssh
          pip install -q pexpect
          python3 crates/cli/tests/e2e.py target/release/myterm
      - name: Package
        run: |
          v="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' apps/mobile/pubspec.yaml)"
          d="myterm-$v-linux-${{ matrix.arch }}"
          mkdir -p "dist/$d/completions"
          cp target/release/myterm "dist/$d/"
          strip "dist/$d/myterm"
          for sh in bash zsh fish; do "dist/$d/myterm" completions $sh > "dist/$d/completions/myterm.$sh"; done
          cp crates/cli/README.md "dist/$d/"
          tar -C dist -czf "dist/$d.tar.gz" "$d"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: myterm-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 14

  windows:
    name: Windows app
    needs: [core]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: flutter_rust_bridge_codegen@2.11.1
      - name: Build
        run: apps/mobile/tool/prepare_windows.sh
      - name: Terminal layout test (real Windows fonts)
        working-directory: apps/mobile
        run: flutter test integration_test/terminal_layout_test.dart -d windows --reporter expanded
      - name: Signing certificate
        # The real key comes from secrets (packaging/windows/New-MyTermSigningCert.ps1
        # puts it there). Without them, builds are signed with a throwaway test
        # certificate so the whole pipeline is still exercised; releases refuse those.
        id: cert
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          if ($env:PFX_B64) {
            $pfx = Join-Path $dir 'myterm-codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
            $password = $env:PFX_PASSWORD
            $kind = 'release'
          } else {
            Write-Warning 'WINDOWS_SIGN_PFX is not set: signing with a throwaway test certificate.'
            packaging/windows/New-MyTermSigningCert.ps1 -Ci -OutDir $dir
            $pfx = Join-Path $dir 'myterm-codesign.pfx'
            $password = Get-Content (Join-Path $dir 'password.txt') -Raw
            $kind = 'test'
          }
          Write-Host "::add-mask::$password"
          # Public certificates from the key's chain, for the release and for
          # checking signatures on this runner.
          $certs = New-Object Security.Cryptography.X509Certificates.X509Certificate2Collection
          $certs.Import($pfx, $password, 'DefaultKeySet')
          $pub = Join-Path $dir 'public'
          New-Item -ItemType Directory -Force -Path $pub | Out-Null
          foreach ($c in $certs) {
            if ($c.HasPrivateKey) {
              [IO.File]::WriteAllBytes((Join-Path $pub 'myterm-codesign.cer'), $c.Export('Cert'))
              Import-Certificate -FilePath (Join-Path $pub 'myterm-codesign.cer') -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
            } else {
              [IO.File]::WriteAllBytes((Join-Path $pub 'myterm-root.cer'), $c.Export('Cert'))
              Import-Certificate -FilePath (Join-Path $pub 'myterm-root.cer') -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            }
          }
          if (-not (Test-Path (Join-Path $pub 'myterm-root.cer'))) { throw 'The signing key has no root certificate in its chain' }
          Copy-Item packaging/windows/Trust-MyTerm.ps1 $pub
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "password=$password" >> $env:GITHUB_OUTPUT
          "kind=$kind" >> $env:GITHUB_OUTPUT
          "public=$pub" >> $env:GITHUB_OUTPUT
      - name: Sign the app
        shell: pwsh
        run: |
          $out = 'apps/mobile/build/windows/x64/runner/Release'
          # Everything that is ours or unsigned; Microsoft's runtime DLLs keep Microsoft's signature.
          $files = Get-ChildItem $out -Recurse -Include *.exe, *.dll |
            Where-Object { $_.Name -notmatch '^(msvcp|vcruntime|concrt)' } | ForEach-Object FullName
          packaging/windows/Sign-Files.ps1 -Pfx '${{ steps.cert.outputs.pfx }}' -Password '${{ steps.cert.outputs.password }}' -Files $files
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = (Select-String -Path apps/mobile/pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $release = (Resolve-Path 'apps/mobile/build/windows/x64/runner/Release').Path
          # Inno Setup signs the installer and uninstaller through this helper. A
          # .cmd on a path without spaces keeps quotes out of ISCC's arguments
          # (PowerShell splits arguments with embedded quotes).
          $env:SIGNTOOL = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $env:SIGN_PFX = '${{ steps.cert.outputs.pfx }}'
          $env:SIGN_PASSWORD = '${{ steps.cert.outputs.password }}'
          $helper = Join-Path $env:RUNNER_TEMP 'mytermsign.cmd'
          Set-Content -Path $helper -Encoding ascii -Value '@"%SIGNTOOL%" sign /q /fd SHA256 /f "%SIGN_PFX%" /p %SIGN_PASSWORD% /tr http://timestamp.digicert.com /td SHA256 /d MyTerm %*'
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$release" /DSIGN "/Smytermsign=$helper `$f" packaging/windows/myterm.iss
          if ($LASTEXITCODE) { throw "ISCC failed ($LASTEXITCODE)" }
          "MYTERM_VERSION=$version" >> $env:GITHUB_ENV
      - name: Check signatures, install, run, uninstall
        shell: pwsh
        run: |
          $setup = "packaging/windows/output/MyTerm-$env:MYTERM_VERSION-setup.exe"
          $exe = 'apps/mobile/build/windows/x64/runner/Release/MyTerm.exe'
          foreach ($f in $setup, $exe, 'apps/mobile/build/windows/x64/runner/Release/myterm_ffi.dll') {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f : $($s.Status) $($s.SignerCertificate.Subject) timestamp: $($null -ne $s.TimeStamperCertificate)"
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'CN=MyTerm') { throw "Bad signature on $f" }
          }
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru -Wait
          if ($p.ExitCode) { throw "Installer exited with $($p.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\MyTerm'
          if (-not (Test-Path "$installed\MyTerm.exe")) { throw 'MyTerm.exe was not installed' }
          if ((Get-AuthenticodeSignature "$installed\unins000.exe").Status -ne 'Valid') { throw 'Uninstaller is not signed' }
          $app = Start-Process "$installed\MyTerm.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "Installed MyTerm.exe exited early with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $u = Start-Process "$installed\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -PassThru -Wait
          # The uninstaller relaunches itself from %TEMP%, so wait for the files to go.
          for ($i = 0; $i -lt 30 -and (Test-Path "$installed\MyTerm.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$installed\MyTerm.exe") { throw 'Uninstall left MyTerm.exe behind' }
          Write-Host 'Installer OK: signed, installs, runs, uninstalls.'
      - name: Collect release files
        shell: pwsh
        run: |
          $dist = 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "packaging/windows/output/MyTerm-$env:MYTERM_VERSION-setup.exe" $dist
          Compress-Archive -Path 'apps/mobile/build/windows/x64/runner/Release/*' -DestinationPath "$dist/MyTerm-$env:MYTERM_VERSION-windows-portable.zip"
          Copy-Item '${{ steps.cert.outputs.public }}/*' $dist
          "${{ steps.cert.outputs.kind }}" | Set-Content "$dist/signing-kind.txt" -NoNewline
          Get-ChildItem $dist
      - uses: actions/upload-artifact@v4
        with:
          name: myterm-windows
          path: dist/
          retention-days: 14
    outputs:
      signing: ${{ steps.cert.outputs.kind }}

  android:
    name: Android APK
    needs: [core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk,flutter_rust_bridge_codegen@2.11.1
      - name: App version is the same everywhere
        run: |
          v="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' apps/mobile/pubspec.yaml)"
          grep -q "appVersion = '$v'" apps/mobile/lib/src/version.dart || { echo "lib/src/version.dart doesn't say $v"; exit 1; }
      - name: Prepare Android build
        run: apps/mobile/tool/prepare_android.sh
      - name: Analyze Dart
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Use the MyTerm dev signing key
        # Same key on every build, so new APKs install as updates.
        # See apps/mobile/android/signing/README.md.
        run: |
          mkdir -p ~/.android
          cp apps/mobile/android/signing/myterm-dev.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: apps/mobile
        run: flutter build apk --release
      - name: Check APK is signed with the MyTerm dev key
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs apps/mobile/build/app/outputs/flutter-apk/app-release.apk | tee /tmp/certs.txt
          grep -qi "SHA-256 digest: 59061e3dfc8e9c2e6f8ad452ba07b1f7b10fe817f3050acd31038209e8966322" /tmp/certs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: myterm-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  release:
    # A push to main whose pubspec.yaml version has no release yet publishes
    # it (tag vX.Y.Z on that commit). Pushing a vX.Y.Z tag works too.
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [core, crates, sync-server, windows, android, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' apps/mobile/pubspec.yaml)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match pubspec version $v"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Releases must be signed with the real MyTerm key
        if: steps.version.outputs.publish == 'true' && needs.windows.outputs.signing != 'release'
        run: |
          echo "::error::WINDOWS_SIGN_PFX / WINDOWS_SIGN_PASSWORD aren't set: run packaging/windows/New-MyTermSigningCert.ps1 first."
          exit 1
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          path: artifacts
      - name: Assemble
        if: steps.version.outputs.publish == 'true'
        run: |
          mkdir release
          cp artifacts/myterm-android-apk/app-release.apk "release/MyTerm-$VERSION.apk"
          cp artifacts/myterm-windows/MyTerm-*-setup.exe artifacts/myterm-windows/MyTerm-*-windows-portable.zip release/
          cp artifacts/myterm-linux-x86_64/*.tar.gz artifacts/myterm-linux-aarch64/*.tar.gz release/
          cp artifacts/myterm-windows/myterm-root.cer artifacts/myterm-windows/myterm-codesign.cer artifacts/myterm-windows/Trust-MyTerm.ps1 release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
          # Notes: this version's section of CHANGELOG.md.
          awk -v v="## $VERSION" '$0 ~ "^## " { if (p) exit; if (index($0, v) == 1) { p = 1; next } } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --title "MyTerm $VERSION" --notes-file notes.md

